name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Pull requests get their own group so they never cancel a production deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-{0}', github.ref) || 'github-pages-production' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      indexnow_changed: ${{ steps.search-facing-diff.outputs.changed }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: sitemap lastmod for static pages comes from git log.
          fetch-depth: 0

      - name: Detect changes that affect indexed pages
        id: search-facing-diff
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -Eq '^(src/content/|src/data/|src/pages/|src/components/|src/layouts/|src/i18n/|src/config/site\.ts$|astro\.config\.mjs$|public/robots\.txt$|public/indexnow-key\.txt$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep agent instruction files identical
        run: cmp CLAUDE.md AGENTS.md && cmp CLAUDE.md .github/copilot-instructions.md

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Built once here; the tests check this build and deploy ships it.
      - name: Build static site
        run: npm run build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The suite runs against `astro preview` of this build.
      - name: Run end-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source for IndexNow notification
        if: needs.verify.outputs.indexnow_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for IndexNow notification
        if: needs.verify.outputs.indexnow_changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Notify participating search engines through IndexNow
        if: needs.verify.outputs.indexnow_changed == 'true'
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: node scripts/submit-indexnow.mjs
