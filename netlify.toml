# Target production configuration. GitHub Pages remains live until the DNS
# cutover checklist in docs/DEPLOYMENT.md is complete.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview.environment]
  ROBOTS = "noindex"

# ── redirects: nothing already indexed may 404 ──────────────────────────
[[redirects]]
  from = "https://suprabhatkumar.com/*"
  to = "https://suprabhat-dev.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.suprabhat-dev.com/*"
  to = "https://suprabhat-dev.com/:splat"
  status = 301
  force = true

# The old sitemap listed article URLs with .html; canonical is now extensionless.
[[redirects]]
  from = "/blog/:slug.html"
  to = "/blog/:slug/"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301

# Explicit localized 404 fallbacks. Keep these last so real static files and
# canonical redirects above win first.
[[redirects]]
  from = "/es/*"
  to = "/es/404/"
  status = 404

[[redirects]]
  from = "/ar/*"
  to = "/ar/404/"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ── headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://api.web3forms.com; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Fonts and hashed build assets are immutable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Public image and icon filenames are stable but not content-hashed. Cache for a
# week, then validate in the background so a deploy can safely replace them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Notes:
# - CSP starts in report-only mode. Enforce it only after route and form QA.
# - X-Frame-Options remains while frame-ancestors is report-only.
# - X-XSS-Protection dropped; it is a no-op alongside a real CSP.
# - Web3Forms is allowed for the legacy homepage's client-side form request.
# - HSTS intentionally omits includeSubDomains and preload until all subdomains
#   have been inventoried and verified on HTTPS.
